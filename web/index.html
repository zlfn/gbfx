<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gb-image-fx</title>
<meta name="description" content="Convert images to Game Boy and Game Boy Color tile data, in the browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%239bbc0f'/><rect x='3' y='3' width='10' height='7' rx='1' fill='%230f380f'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">gb-image-fx</span>
  </div>
  <div class="topbar-links">
    <a href="https://crates.io/crates/gb-image-fx">crate</a>
    <a href="https://github.com/zlfn/rust-gb/tree/main/tools/gb-image-fx">source</a>
  </div>
</header>

<main class="layout">

  <!-- ── controls ─────────────────────────────────────────── -->
  <aside class="panel" id="controls">

    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="image/*" hidden>
      <span class="drop-icon" aria-hidden="true"></span>
      <span class="drop-title">Drop an image</span>
      <span class="drop-hint">or click to choose &middot; PNG, JPEG, GIF, WebP</span>
    </label>

    <button type="button" class="ghost wide" id="try-example">Try an example</button>

    <div class="field-group" id="opts" hidden>

      <section class="field-set">
        <h2>Console</h2>
        <div class="segmented" role="radiogroup" aria-label="Console">
          <input type="radio" name="console" id="c-gbc" value="gbc" checked>
          <label for="c-gbc">Game Boy Color</label>
          <input type="radio" name="console" id="c-dmg" value="dmg">
          <label for="c-dmg">Game Boy</label>
        </div>
      </section>

      <section class="field-set">
        <h2>Size</h2>
        <div class="row">
          <label class="check"><input type="checkbox" id="do-quantize" checked> Reduce colours</label>
        </div>
        <div class="row size-row" id="size-row">
          <input type="number" id="qw" value="160" min="8" step="8" aria-label="Width">
          <span class="times">&times;</span>
          <input type="number" id="qh" value="144" min="8" step="8" aria-label="Height">
          <button type="button" class="ghost" id="preset-screen">screen</button>
        </div>
        <p class="note" id="size-note">Both a multiple of 8. The image is stretched to fit.</p>
      </section>

      <section class="field-set" id="palette-set">
        <h2>Palettes</h2>
        <div class="row slider-row">
          <input type="range" id="maxpal" min="1" max="8" value="8">
          <output for="maxpal" id="maxpal-out">8</output>
        </div>
        <label class="check"><input type="checkbox" id="gbc-correct"> Correct for the console screen</label>
      </section>

      <section class="field-set">
        <h2>Dither</h2>
        <label class="check"><input type="checkbox" id="do-dither"> Dither</label>
        <div class="dither-body" id="dither-body">
          <div class="row slider-row">
            <input type="range" id="dither-w" min="0" max="1" step="0.05" value="0.5">
            <output for="dither-w" id="dither-out">0.50</output>
          </div>
          <select id="dither-m" aria-label="Dither pattern">
            <option value="blue">blue noise</option>
            <option value="bayer">bayer</option>
            <option value="ordered">ordered</option>
          </select>
        </div>
      </section>

      <section class="field-set">
        <h2>Tiles</h2>
        <label class="check"><input type="checkbox" id="do-map"> Tile map</label>
        <label class="check sub"><input type="checkbox" id="do-dedup"> Fold identical tiles</label>
        <label class="check sub2"><input type="checkbox" id="do-flip"> Also fold mirrored</label>
      </section>

      <section class="field-set">
        <h2>Sprites</h2>
        <label class="check"><input type="checkbox" id="do-obj"> Transparent index 0</label>
        <label class="check"><input type="checkbox" id="do-meta"> Metasprite cells</label>
        <div class="row size-row" id="meta-row">
          <input type="number" id="mw" value="16" min="8" step="8" aria-label="Cell width">
          <span class="times">&times;</span>
          <input type="number" id="mh" value="16" min="8" step="8" aria-label="Cell height">
        </div>
      </section>

    </div>
  </aside>

  <!-- ── stage ────────────────────────────────────────────── -->
  <section class="stage">

    <div class="stage-bar">
      <div class="tabs" role="tablist">
        <button class="tab is-active" data-view="preview" role="tab">Preview</button>
        <button class="tab" data-view="tiles" role="tab">Tiles</button>
        <button class="tab" data-view="palettes" role="tab">Palettes</button>
      </div>
      <div class="zoom" id="zoom-wrap">
        <button type="button" class="ghost icon" id="zoom-out" aria-label="Zoom out">&minus;</button>
        <span id="zoom-label">2&times;</span>
        <button type="button" class="ghost icon" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>

    <div class="viewport" id="viewport">

      <div class="empty" id="empty">
        <p>Nothing loaded yet.</p>
        <p class="muted">Drop an image on the left to begin.</p>
      </div>

      <div class="busy" id="busy" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="busy-label">Converting&hellip;</span>
      </div>

      <div class="view" id="view-preview" hidden>
        <div class="compare">
          <figure><figcaption>source</figcaption><canvas id="cv-source"></canvas></figure>
          <figure><figcaption id="cap-result">result</figcaption><canvas id="cv-result" class="checker"></canvas></figure>
        </div>
      </div>

      <div class="view" id="view-tiles" hidden>
        <div class="tilegrid" id="tilegrid"></div>
      </div>

      <div class="view" id="view-palettes" hidden>
        <div class="palettes" id="palettes"></div>
      </div>

    </div>

    <div class="stage-foot" id="foot" hidden>
      <dl class="stats" id="stats"></dl>
      <div class="downloads" id="downloads"></div>
    </div>

    <p class="error" id="error" hidden></p>

  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
